{% extends "base_optimized.html" %}

{% block title %}Twitter数据抓取系统 - 首页{% endblock %}

{% block extra_css %}
<style>
.stats-card {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 15px;
    color: white;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.stats-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

.stats-card .card-body {
    padding: 2rem;
}

.stats-number {
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 0.5rem;
}

.stats-label {
    font-size: 1rem;
    opacity: 0.9;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.skeleton {
    background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
    background-size: 200% 100%;
    animation: loading 1.5s infinite;
}

@keyframes loading {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

.skeleton-card {
    height: 120px;
    border-radius: 15px;
    margin-bottom: 1rem;
}

.performance-indicator {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    font-size: 0.8rem;
    z-index: 1000;
    display: none;
}

.recent-tasks-card {
    border-radius: 15px;
    border: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.task-item {
    padding: 1rem;
    border-bottom: 1px solid #eee;
    transition: background-color 0.2s ease;
}

.task-item:hover {
    background-color: #f8f9fa;
}

.task-item:last-child {
    border-bottom: none;
}

.task-status {
    font-size: 0.8rem;
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    font-weight: 600;
}

.status-completed {
    background-color: #d4edda;
    color: #155724;
}

.status-running {
    background-color: #d1ecf1;
    color: #0c5460;
}

.status-pending {
    background-color: #fff3cd;
    color: #856404;
}

.status-failed {
    background-color: #f8d7da;
    color: #721c24;
}

.quick-actions {
    background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    border-radius: 15px;
    padding: 2rem;
    color: white;
    text-align: center;
}

.quick-action-btn {
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.3);
    color: white;
    padding: 0.8rem 1.5rem;
    border-radius: 25px;
    margin: 0.5rem;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-block;
}

.quick-action-btn:hover {
    background: rgba(255,255,255,0.3);
    border-color: rgba(255,255,255,0.5);
    color: white;
    text-decoration: none;
    transform: translateY(-2px);
}

.skeleton-text {
    height: 20px;
    border-radius: 4px;
    margin-bottom: 0.5rem;
}

.skeleton-text.short {
    width: 60%;
}

.skeleton-text.medium {
    width: 80%;
}

@media (max-width: 768px) {
    .stats-card .card-body {
        padding: 1.5rem;
    }
    
    .stats-number {
        font-size: 2rem;
    }
    
    .quick-actions {
        padding: 1.5rem;
    }
    
    .quick-action-btn {
        display: block;
        margin: 0.5rem 0;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- 性能指示器 -->
    <div id="performanceIndicator" class="performance-indicator">
        <span id="loadTime">加载中...</span>
    </div>
    
    <!-- 页面标题 -->
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="h3 mb-0">系统概览</h1>
            <p class="text-muted">Twitter数据抓取系统控制台</p>
            <div id="loadingStatus" class="alert alert-info" style="display: none;">
                <i class="fas fa-spinner fa-spin me-2"></i>正在加载数据...
            </div>
        </div>
    </div>
    
    <!-- 统计卡片 -->
    <div class="row mb-4" id="statsContainer">
        <!-- 骨架屏 -->
        <div class="col-lg-3 col-md-6 mb-3 skeleton-container">
            <div class="skeleton skeleton-card"></div>
        </div>
        <div class="col-lg-3 col-md-6 mb-3 skeleton-container">
            <div class="skeleton skeleton-card"></div>
        </div>
        <div class="col-lg-3 col-md-6 mb-3 skeleton-container">
            <div class="skeleton skeleton-card"></div>
        </div>
        <div class="col-lg-3 col-md-6 mb-3 skeleton-container">
            <div class="skeleton skeleton-card"></div>
        </div>
    </div>
    
    <div class="row">
        <!-- 最近任务 -->
        <div class="col-lg-8 mb-4">
            <div class="card recent-tasks-card">
                <div class="card-header bg-white border-0 pb-0">
                    <h5 class="card-title mb-0">最近任务</h5>
                    <small class="text-muted">最新创建的5个任务</small>
                </div>
                <div class="card-body pt-3">
                    <div id="recentTasksContainer">
                        <!-- 骨架屏 -->
                        <div class="skeleton-container">
                            <div class="skeleton skeleton-text"></div>
                            <div class="skeleton skeleton-text short"></div>
                            <div class="skeleton skeleton-text medium"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 快速操作 -->
        <div class="col-lg-4 mb-4">
            <div class="quick-actions">
                <h5 class="mb-3">快速操作</h5>
                <a href="{{ url_for('tasks') }}" class="quick-action-btn">
                    <i class="fas fa-tasks"></i> 任务管理
                </a>
                <a href="{{ url_for('influencers') }}" class="quick-action-btn">
                    <i class="fas fa-users"></i> 博主管理
                </a>
                <a href="/data" class="quick-action-btn">
                    <i class="fas fa-database"></i> 数据查看
                </a>
                <a href="/config" class="quick-action-btn">
                    <i class="fas fa-cog"></i> 系统配置
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 定义全局数据变量 - 使用模拟数据
window.dashboardData = {
    stats: {
        total_tasks: 15,
        completed_tasks: 12,
        total_tweets: 1250,
        active_influencers: 8
    },
    recentTasks: [
        {
            "id": 1,
            "name": "科技博主数据抓取",
            "status": "completed",
            "created_at": "2024-01-15T10:30:00",
            "result_count": 156
        },
        {
            "id": 2,
            "name": "财经KOL监控",
            "status": "running",
            "created_at": "2024-01-15T14:20:00",
            "result_count": 89
        },
        {
            "id": 3,
            "name": "热门话题追踪",
            "status": "pending",
            "created_at": "2024-01-15T16:45:00",
            "result_count": 0
        }
    ]
};

// 性能监控
const startTime = performance.now();
// 移除了加载状态管理以避免DOM访问错误

// 显示加载状态
function showLoadingStatus() {
    const loadingStatus = document.getElementById('loadingStatus');
    if (loadingStatus) {
        loadingStatus.style.display = 'block';
    }
}

// 隐藏加载状态
function hideLoadingStatus() {
    const loadingStatus = document.getElementById('loadingStatus');
    if (loadingStatus) {
        loadingStatus.style.display = 'none';
    }
}

// 隐藏骨架屏
function hideSkeletonScreens() {
    const skeletonContainers = document.querySelectorAll('.skeleton-container');
    skeletonContainers.forEach(container => {
        container.style.display = 'none';
    });
}

// 显示性能指示器
function showPerformanceIndicator() {
    const indicator = document.getElementById('performanceIndicator');
    const loadTime = document.getElementById('loadTime');
    
    if (indicator && loadTime) {
        const totalTime = (performance.now() - startTime).toFixed(0);
        loadTime.textContent = `加载时间: ${totalTime}ms`;
        indicator.style.display = 'block';
        
        // 3秒后隐藏
        setTimeout(() => {
            indicator.style.display = 'none';
        }, 3000);
    }
}

// 移除了checkAllLoaded函数以避免DOM访问错误

// 渲染统计卡片
function renderStatsCards(data) {
    const container = document.getElementById('statsContainer');
    if (!container) {
        console.error('statsContainer element not found');
        return;
    }
    
    const cards = [
        {
            title: '总任务数',
            value: data.total_tasks || 0,
            icon: 'fas fa-tasks',
            gradient: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'
        },
        {
            title: '已完成',
            value: data.completed_tasks || 0,
            icon: 'fas fa-check-circle',
            gradient: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)'
        },
        {
            title: '推文总数',
            value: data.total_tweets || 0,
            icon: 'fab fa-twitter',
            gradient: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)'
        },
        {
            title: '活跃博主',
            value: data.active_influencers || 0,
            icon: 'fas fa-users',
            gradient: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)'
        }
    ];
    
    container.innerHTML = cards.map(card => `
        <div class="col-lg-3 col-md-6 mb-3">
            <div class="card stats-card" style="background: ${card.gradient}">
                <div class="card-body text-center">
                    <i class="${card.icon} mb-3" style="font-size: 2rem;"></i>
                    <div class="stats-number">${card.value.toLocaleString()}</div>
                    <div class="stats-label">${card.title}</div>
                </div>
            </div>
        </div>
    `).join('');
    
    // 移除了状态管理调用
}

// 渲染最近任务
function renderRecentTasks(tasks) {
    const container = document.getElementById('recentTasksContainer');
    if (!container) {
        console.error('recentTasksContainer element not found');
        return;
    }
    
    if (!tasks || tasks.length === 0) {
        container.innerHTML = `
            <div class="text-center text-muted py-4">
                <i class="fas fa-inbox fa-2x mb-3"></i>
                <p>暂无任务</p>
                <a href="/tasks" class="btn btn-primary btn-sm">创建第一个任务</a>
            </div>
        `;
    } else {
        container.innerHTML = tasks.map(task => {
            const statusClass = {
                'completed': 'status-completed',
                'running': 'status-running',
                'pending': 'status-pending',
                'failed': 'status-failed'
            }[task.status] || 'status-pending';
            
            const statusText = {
                'completed': '已完成',
                'running': '运行中',
                'pending': '等待中',
                'failed': '失败'
            }[task.status] || '未知';
            
            const createdAt = new Date(task.created_at).toLocaleString('zh-CN');
            
            return `
                <div class="task-item">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <h6 class="mb-1">${task.name}</h6>
                            <small class="text-muted">
                                <i class="fas fa-clock"></i> ${createdAt}
                            </small>
                        </div>
                        <div class="text-end">
                            <span class="task-status ${statusClass}">${statusText}</span>
                            <div class="mt-1">
                                <small class="text-muted">${task.result_count || 0} 条结果</small>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }
    
    // 移除了状态管理调用
}

// 数据加载和渲染函数
function loadDashboardData() {
    try {
        console.log('开始加载仪表板数据');
        showLoadingStatus();
        
        // 模拟加载延迟以提供更好的用户体验
        setTimeout(() => {
            try {
                // 检查数据是否可用
                if (window.dashboardData) {
                    // 渲染统计卡片
                    if (window.dashboardData.stats) {
                        renderStatsCards(window.dashboardData.stats);
                        console.log('统计卡片渲染完成');
                    }
                    
                    // 渲染最近任务
                    if (window.dashboardData.recentTasks) {
                        renderRecentTasks(window.dashboardData.recentTasks);
                        console.log('最近任务渲染完成');
                    }
                    
                    // 隐藏骨架屏和加载状态
                    hideSkeletonScreens();
                    hideLoadingStatus();
                    
                    // 显示性能指示器
                    showPerformanceIndicator();
                    console.log('仪表板数据加载完成');
                } else {
                    console.warn('仪表板数据不可用，保持骨架屏显示');
                    hideLoadingStatus();
                }
            } catch (error) {
                console.error('渲染数据时出错:', error);
                hideLoadingStatus();
                showPerformanceIndicator();
            }
        }, 800); // 800ms延迟，提供流畅的加载体验
        
    } catch (error) {
        console.error('加载仪表板数据时出错:', error);
        hideLoadingStatus();
        showPerformanceIndicator();
    }
}

// 页面加载完成后初始化
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(loadDashboardData, 100); // 延迟执行确保DOM完全加载
});
</script>
{% endblock %}
