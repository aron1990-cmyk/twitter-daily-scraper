<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定时任务管理 - Twitter采集系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .task-card {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .task-card:hover {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .task-status {
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
        }
        .status-enabled {
            background-color: #d4edda;
            color: #155724;
        }
        .status-disabled {
            background-color: #f8d7da;
            color: #721c24;
        }
        .status-running {
            background-color: #d1ecf1;
            color: #0c5460;
        }
        .next-run {
            color: #6c757d;
            font-size: 0.9em;
        }
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
        }
        .btn-action {
            margin: 2px;
            padding: 4px 8px;
            font-size: 0.8em;
        }
        .modal-header {
            background-color: #f8f9fa;
        }
        .form-label {
            font-weight: 600;
        }
        .alert-custom {
            border-radius: 8px;
            border: none;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-clock me-2"></i>定时任务管理
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">首页</a>
                <a class="nav-link" href="/tasks">任务管理</a>
                <a class="nav-link" href="/data">数据查看</a>
                <a class="nav-link" href="/config">系统配置</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- 页面标题和操作按钮 -->
        <div class="row mb-4">
            <div class="col-md-8">
                <h2><i class="fas fa-clock text-primary me-2"></i>定时任务管理</h2>
                <p class="text-muted">管理系统的定时任务，包括每日采集、数据备份等自动化任务</p>
            </div>
            <div class="col-md-4 text-end">
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#createTaskModal">
                    <i class="fas fa-plus me-1"></i>创建定时任务
                </button>
                <button class="btn btn-info" onclick="refreshTasks()">
                    <i class="fas fa-sync-alt me-1"></i>刷新
                </button>
            </div>
        </div>

        <!-- 统计信息 -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <h4 id="totalTasks">-</h4>
                        <p class="mb-0">总任务数</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <h4 id="enabledTasks">-</h4>
                        <p class="mb-0">已启用</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <h4 id="runningTasks">-</h4>
                        <p class="mb-0">运行中</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <h4 id="completedToday">-</h4>
                        <p class="mb-0">今日完成</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 调度器状态 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-cogs me-2"></i>调度器状态</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <strong>状态:</strong> <span id="schedulerStatus" class="badge">-</span>
                            </div>
                            <div class="col-md-3">
                                <strong>运行时间:</strong> <span id="schedulerUptime">-</span>
                            </div>
                            <div class="col-md-3">
                                <strong>下次检查:</strong> <span id="nextCheck">-</span>
                            </div>
                            <div class="col-md-3">
                                <strong>总执行次数:</strong> <span id="totalExecutions">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 任务列表 -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-list me-2"></i>定时任务列表</h5>
                    </div>
                    <div class="card-body">
                        <div id="tasksContainer">
                            <div class="text-center py-4">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">加载中...</span>
                                </div>
                                <p class="mt-2 text-muted">正在加载任务列表...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 创建任务模态框 -->
    <div class="modal fade" id="createTaskModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-plus me-2"></i>创建定时任务</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createTaskForm">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="taskId" class="form-label">关联任务</label>
                                    <div class="input-group">
                                        <select class="form-select" id="taskId" required>
                                            <option value="">请选择现有任务</option>
                                        </select>
                                        <button class="btn btn-outline-secondary" type="button" onclick="loadAvailableTasks()">
                                            <i class="fas fa-sync-alt"></i>
                                        </button>
                                    </div>
                                    <div class="form-text">从现有任务列表中选择要关联的任务</div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="taskName" class="form-label">任务名称</label>
                                    <input type="text" class="form-control" id="taskName" required>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="scheduleTime" class="form-label">执行时间</label>
                                    <div class="input-group">
                                        <select class="form-select" id="scheduleType" onchange="toggleScheduleInput()">
                                            <option value="time">指定时间</option>
                                            <option value="interval">间隔执行</option>
                                        </select>
                                        <input type="time" class="form-control" id="scheduleTimeInput" required>
                                        <input type="text" class="form-control d-none" id="scheduleIntervalInput" placeholder="例如: every 2 hours">
                                    </div>
                                    <div class="form-text">选择指定时间或间隔表达式</div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="taskFunction" class="form-label">任务函数</label>
                                    <select class="form-select" id="taskFunction" required>
                                        <option value="">请选择任务函数</option>
                                        <option value="daily_twitter_scraping">每日Twitter采集</option>
                                        <option value="system_health_check">系统健康检查</option>
                                        <option value="data_backup">数据备份</option>
                                        <option value="cleanup_old_data">清理旧数据</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">任务描述</label>
                            <textarea class="form-control" id="description" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="maxRetries" class="form-label">最大重试次数</label>
                                    <input type="number" class="form-control" id="maxRetries" value="3" min="0" max="10">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="timeoutMinutes" class="form-label">超时时间(分钟)</label>
                                    <input type="number" class="form-control" id="timeoutMinutes" value="60" min="1" max="1440">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label class="form-label">启用状态</label>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="enabled" checked>
                                        <label class="form-check-label" for="enabled">
                                            创建后立即启用
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="createTask()">创建任务</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 消息提示 -->
    <div id="alertContainer" class="position-fixed top-0 end-0 p-3" style="z-index: 1050;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadTasks();
            loadSchedulerStatus();
            loadStatistics();
            loadAvailableTasks(); // 加载可用任务列表
            
            // 监听模态框打开事件
            const createTaskModal = document.getElementById('createTaskModal');
            createTaskModal.addEventListener('show.bs.modal', function() {
                loadAvailableTasks(); // 每次打开模态框时刷新任务列表
                document.getElementById('createTaskForm').reset(); // 重置表单
                toggleScheduleInput(); // 重置时间输入方式
            });
            
            // 每30秒刷新一次状态
            setInterval(() => {
                loadSchedulerStatus();
                loadStatistics();
            }, 30000);
        });

        // 切换时间输入方式
        function toggleScheduleInput() {
            const scheduleType = document.getElementById('scheduleType').value;
            const timeInput = document.getElementById('scheduleTimeInput');
            const intervalInput = document.getElementById('scheduleIntervalInput');
            
            if (scheduleType === 'time') {
                timeInput.classList.remove('d-none');
                intervalInput.classList.add('d-none');
                timeInput.required = true;
                intervalInput.required = false;
            } else {
                timeInput.classList.add('d-none');
                intervalInput.classList.remove('d-none');
                timeInput.required = false;
                intervalInput.required = true;
            }
        }

        // 加载可用任务列表
        async function loadAvailableTasks() {
            try {
                const response = await fetch('/api/tasks');
                const result = await response.json();
                
                const taskSelect = document.getElementById('taskId');
                taskSelect.innerHTML = '<option value="">请选择现有任务</option>';
                
                // 处理API返回的数据结构
                const tasks = result.success ? result.tasks : result;
                
                if (Array.isArray(tasks)) {
                    tasks.forEach(task => {
                        const option = document.createElement('option');
                        option.value = task.id;
                        option.textContent = `${task.name} (ID: ${task.id})`;
                        taskSelect.appendChild(option);
                    });
                } else {
                    console.error('任务数据格式错误:', tasks);
                    showMessage('任务数据格式错误', 'warning');
                }
            } catch (error) {
                console.error('加载任务列表失败:', error);
                showMessage('加载任务列表失败: ' + error.message, 'warning');
            }
        }

        // 显示消息
        function showMessage(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alertId = 'alert-' + Date.now();
            
            const alertHtml = `
                <div id="${alertId}" class="alert alert-${type} alert-dismissible fade show alert-custom" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            
            alertContainer.insertAdjacentHTML('beforeend', alertHtml);
            
            // 3秒后自动消失
            setTimeout(() => {
                const alert = document.getElementById(alertId);
                if (alert) {
                    const bsAlert = new bootstrap.Alert(alert);
                    bsAlert.close();
                }
            }, 3000);
        }

        // 加载任务列表
        async function loadTasks() {
            try {
                const response = await fetch('/api/scheduler/tasks');
                const result = await response.json();
                
                if (result.success) {
                    displayTasks(result.data);
                } else {
                    showMessage('加载任务列表失败: ' + result.error, 'danger');
                }
            } catch (error) {
                showMessage('加载任务列表时发生错误: ' + error.message, 'danger');
            }
        }

        // 显示任务列表
        function displayTasks(tasks) {
            const container = document.getElementById('tasksContainer');
            
            if (tasks.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-4">
                        <i class="fas fa-clock fa-3x text-muted mb-3"></i>
                        <h5 class="text-muted">暂无定时任务</h5>
                        <p class="text-muted">点击"创建定时任务"按钮添加新的定时任务</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            tasks.forEach(task => {
                const statusClass = task.enabled ? 'status-enabled' : 'status-disabled';
                const statusText = task.enabled ? '已启用' : '已禁用';
                const nextRun = task.next_run ? new Date(task.next_run).toLocaleString() : '未安排';
                
                html += `
                    <div class="task-card p-3">
                        <div class="row align-items-center">
                            <div class="col-md-6">
                                <h6 class="mb-1">${task.name}</h6>
                                <p class="text-muted mb-1">${task.description || '无描述'}</p>
                                <small class="text-muted">ID: ${task.task_id} | 执行时间: ${task.schedule_time}</small>
                            </div>
                            <div class="col-md-3">
                                <div class="mb-1">
                                    <span class="task-status ${statusClass}">${statusText}</span>
                                </div>
                                <div class="next-run">
                                    <i class="fas fa-clock me-1"></i>下次执行: ${nextRun}
                                </div>
                                <div class="text-muted small">
                                    执行次数: ${task.execution_count || 0} | 失败次数: ${task.failure_count || 0}
                                </div>
                            </div>
                            <div class="col-md-3 text-end">
                                <div class="btn-group-vertical" role="group">
                                    <button class="btn btn-sm btn-primary btn-action" onclick="runTaskNow('${task.task_id}')">
                                        <i class="fas fa-play me-1"></i>立即执行
                                    </button>
                                    ${task.enabled ? 
                                        `<button class="btn btn-sm btn-warning btn-action" onclick="toggleTask('${task.task_id}', false)">
                                            <i class="fas fa-pause me-1"></i>禁用
                                        </button>` :
                                        `<button class="btn btn-sm btn-success btn-action" onclick="toggleTask('${task.task_id}', true)">
                                            <i class="fas fa-play me-1"></i>启用
                                        </button>`
                                    }
                                    <button class="btn btn-sm btn-danger btn-action" onclick="deleteTask('${task.task_id}')">
                                        <i class="fas fa-trash me-1"></i>删除
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // 加载调度器状态
        async function loadSchedulerStatus() {
            try {
                const response = await fetch('/api/scheduler/status');
                const result = await response.json();
                
                if (result.success) {
                    const status = result.data;
                    document.getElementById('schedulerStatus').textContent = status.is_running ? '运行中' : '已停止';
                    document.getElementById('schedulerStatus').className = status.is_running ? 'badge bg-success' : 'badge bg-danger';
                    document.getElementById('schedulerUptime').textContent = status.uptime || '未知';
                    document.getElementById('nextCheck').textContent = status.next_check ? new Date(status.next_check).toLocaleString() : '未知';
                }
            } catch (error) {
                console.error('加载调度器状态失败:', error);
            }
        }

        // 加载统计信息
        async function loadStatistics() {
            try {
                const response = await fetch('/api/scheduler/statistics');
                const result = await response.json();
                
                if (result.success) {
                    const stats = result.data;
                    document.getElementById('totalTasks').textContent = stats.total_tasks || 0;
                    document.getElementById('enabledTasks').textContent = stats.enabled_tasks || 0;
                    document.getElementById('runningTasks').textContent = stats.running_tasks || 0;
                    document.getElementById('completedToday').textContent = stats.completed_today || 0;
                    document.getElementById('totalExecutions').textContent = stats.total_executions || 0;
                }
            } catch (error) {
                console.error('加载统计信息失败:', error);
            }
        }

        // 创建任务
        async function createTask() {
            const form = document.getElementById('createTaskForm');
            
            // 获取时间值
            const scheduleType = document.getElementById('scheduleType').value;
            let scheduleTime;
            if (scheduleType === 'time') {
                scheduleTime = document.getElementById('scheduleTimeInput').value;
            } else {
                scheduleTime = document.getElementById('scheduleIntervalInput').value;
            }
            
            const taskData = {
                task_id: `scheduled_${document.getElementById('taskId').value}_${Date.now()}`, // 生成唯一的定时任务ID
                name: document.getElementById('taskName').value,
                schedule_time: scheduleTime,
                task_function: document.getElementById('taskFunction').value,
                description: document.getElementById('description').value,
                max_retries: parseInt(document.getElementById('maxRetries').value),
                timeout_minutes: parseInt(document.getElementById('timeoutMinutes').value),
                enabled: document.getElementById('enabled').checked,
                related_task_id: document.getElementById('taskId').value // 关联的原始任务ID
            };
            
            try {
                const response = await fetch('/api/scheduler/tasks', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(taskData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('定时任务创建成功', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('createTaskModal')).hide();
                    form.reset();
                    toggleScheduleInput(); // 重置时间输入方式
                    loadTasks();
                    loadStatistics();
                } else {
                    showMessage('创建任务失败: ' + result.error, 'danger');
                }
            } catch (error) {
                showMessage('创建任务时发生错误: ' + error.message, 'danger');
            }
        }

        // 切换任务状态
        async function toggleTask(taskId, enable) {
            const action = enable ? 'enable' : 'disable';
            
            try {
                const response = await fetch(`/api/scheduler/tasks/${taskId}/${action}`, {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(result.message, 'success');
                    loadTasks();
                    loadStatistics();
                } else {
                    showMessage('操作失败: ' + result.error, 'danger');
                }
            } catch (error) {
                showMessage('操作时发生错误: ' + error.message, 'danger');
            }
        }

        // 立即执行任务
        async function runTaskNow(taskId) {
            if (!confirm('确定要立即执行这个任务吗？')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/scheduler/tasks/${taskId}/run`, {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(result.message, 'success');
                    loadTasks();
                } else {
                    showMessage('执行失败: ' + result.error, 'danger');
                }
            } catch (error) {
                showMessage('执行时发生错误: ' + error.message, 'danger');
            }
        }

        // 删除任务
        async function deleteTask(taskId) {
            if (!confirm('确定要删除这个定时任务吗？此操作不可撤销。')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/scheduler/tasks/${taskId}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(result.message, 'success');
                    loadTasks();
                    loadStatistics();
                } else {
                    showMessage('删除失败: ' + result.error, 'danger');
                }
            } catch (error) {
                showMessage('删除时发生错误: ' + error.message, 'danger');
            }
        }

        // 刷新任务列表
        function refreshTasks() {
            loadTasks();
            loadSchedulerStatus();
            loadStatistics();
            showMessage('已刷新任务列表', 'info');
        }
    </script>
</body>
</html>
